<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erik's Hub | Aktuelle Projekte</title>
  <meta name="description" content="Öffentliche GitHub-Repositories & aktuelle Projekte" />

  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://erikdevelopment.github.io/me/projects.html">
  <meta name="theme-color" content="#0a0f14">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Erik's Hub">
  <meta property="og:locale" content="de_DE">
  <meta property="og:url" content="https://erikdevelopment.github.io/me/projects.html">
  <meta property="og:title" content="Erik&#x27;s Hub | Aktuelle Projekte">
  <meta property="og:description" content="Öffentliche GitHub-Repositories &amp; aktuelle Projekte">
  <meta property="og:image" content="https://avatars.githubusercontent.com/u/105929625?s=400">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Erik&#x27;s Hub | Aktuelle Projekte">
  <meta name="twitter:description" content="Öffentliche GitHub-Repositories &amp; aktuelle Projekte">
  <meta name="twitter:image" content="https://avatars.githubusercontent.com/u/105929625?s=400">

  <link rel="preload" href="assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/projects.css" />
</head>

<body>
  <div class="background-grid"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <span class="logo">ERIK'S HUB</span>
      <a href="linktree.html" class="back-btn">← zurück</a>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <section class="intro">
      <h1><span class="highlight">$</span> projects</h1>
      <p>
        Alle öffentlichen Repositories von
        <span class="highlight">@ErikDevelopment</span> — automatisch geladen.
      </p>

      <!-- Controls -->
      <div class="controls">
        <!-- Search -->
        <input
          id="search"
          class="input"
          type="search"
          placeholder="Repo suchen…"
          aria-label="Repositories durchsuchen (Name, Beschreibung, Sprache)"
          title="Sucht in Name, Beschreibung und Sprache"
        />

        <!-- Sort Select -->
        <div class="custom-select" id="sortSelect">
          <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Sortierung">
            <span>Aktualisiert</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>

          <div class="select-menu" role="listbox" aria-label="Sortierung">
            <div role="option" tabindex="-1" data-value="updated" aria-selected="true" class="active">Aktualisiert</div>
            <div role="option" tabindex="-1" data-value="stars" aria-selected="false">Stars</div>
            <div role="option" tabindex="-1" data-value="name" aria-selected="false">Name</div>
          </div>
        </div>

        <!-- Orga Select -->
        <div class="custom-select" id="orgaSelect">
          <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Organisation">
            <span>Alle Repos</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>

          <div class="select-menu" id="orgaMenu" role="listbox" aria-label="Organisation">
            <!-- JS füllt Orgas -->
          </div>
        </div>

        <!-- Hide Forks -->
        <label class="check">
          <input id="hideForks" type="checkbox" />
          <span class="custom-check"></span>
          Forks ausblenden
        </label>
      </div>

      <div class="stats" id="stats" aria-live="polite"></div>
    </section>

    <!-- Grid -->
    <section class="grid" id="grid" aria-live="polite"></section>

    <!-- State -->
    <section class="state" id="state">
      <div class="loader" id="loader">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="loading-text">Lade Repositories…</span>
      </div>

      <div class="error" id="error" hidden></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p><span class="highlight">$</span> echo "Made with ❤️ and lots of ☕"</p>
  </footer>

  <!-- Scripts -->
  <script src="js/projects.js"></script>
  <script src="js/easter-egg.js"></script>
</body>
</html>
